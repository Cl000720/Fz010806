<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>风筝的音乐收藏</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 所有CSS样式保持不变 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('a.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 5px;
            padding: 20px;
            color: white;
            position: relative;
        }
        
        .profile-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            margin-bottom: 15px;
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            color: #fff;
        }
        
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 500px;
            margin: 0 auto;
            margin-bottom: 5px;
        }
        
        .search-box {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 12px 20px;
            margin: 10px auto 15px;
            max-width: 500px;
            width: 100%;
            display: flex;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            height: 54px;
        }
        
        .search-box:hover {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }
        
        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 1.1rem;
            padding: 5px 10px;
            color: #fff;
            height: 100%;
        }
        
        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.8);
        }
        
        .search-box i {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
            margin-right: 10px;
        }
        
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .action-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            flex: 1;
            min-width: 140px;
        }
        
        .action-btn:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        
        .action-btn:active {
            transform: translateY(0);
        }
        
        .filters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            position: relative;
            z-index: 100;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }

        .custom-select {
            position: relative;
            width: 100%;
        }
        
        .select-selected {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            color: #ffffff;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 18px;
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
            height: 46px;
            width: 100%;
        }
        
        .select-selected:after {
            content: "";
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 8px solid rgba(255, 255, 255, 0.8);
            transition: all 0.3s;
        }
        
        .select-selected.select-arrow-active:after {
            transform: rotate(180deg);
        }
        
        .select-selected:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .select-items {
            position: absolute;
            background-color: rgba(50, 50, 70, 0.95);
            backdrop-filter: blur(10px);
            top: 100%;
            left: 0;
            right: 0;
            z-index: 999;
            border-radius: 0 0 15px 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            max-height: 0;
            opacity: 0;
            transition: all 0.3s ease;
            overflow-y: auto;
            width: 100%;
        }
        
        .select-items.active {
            max-height: 300px;
            opacity: 1;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: none;
        }
        
        .select-item {
            padding: 12px 15px;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .select-item:last-child {
            border-bottom: none;
        }
        
        .select-item:hover {
            background-color: rgba(70, 70, 100, 0.8);
        }
        
        .select-item.selected {
            background-color: rgba(90, 90, 130, 0.8);
            font-weight: 600;
        }
        
        .song-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }
        
        .song-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            min-height: 48px;
            height: 48px;
            cursor: pointer;
            position: relative;
        }
        
        .song-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .song-card.copied::after {
            content: '已复制';
            position: absolute;
            top: -10px;
            right: -10px;
            background: #4CAF50;
            color: white;
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
            animation: fadeOut 1.5s forwards;
        }
        
        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; }
        }
        
        .song-number {
            font-size: 1.3rem;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.9);
            margin-right: 12px;
            min-width: 28px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        
        .song-info {
            flex: 1;
            display: flex;
            align-items: center;
            height: 100%;
        }
        
        .song-title {
            font-size: 1rem;
            margin-bottom: 0;
            color: #fff;
            font-weight: 600;
            line-height: 1.2;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: flex;
            align-items: center;
            height: 100%;
        }
        
        .empty-message {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            grid-column: 1 / -1;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            animation: pulse 2s infinite;
            margin-top: 20px;
        }
        
        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
        
        .copy-notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .copy-notification.show {
            opacity: 1;
        }

        /* 回到顶部按钮样式 */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            z-index: 1000;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .back-to-top:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
        }
        
        .back-to-top i {
            font-size: 1.5rem;
        }
        
        @media (max-width: 768px) {
            .song-list {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                margin-top: 15px;
                gap: 10px;
            }
            
            header h1 {
                font-size: 2rem;
            }
            
            .profile-img {
                width: 100px;
                height: 100px;
            }
            
            .search-box {
                max-width: 400px;
                margin: 8px auto 12px;
                height: 50px;
                padding: 10px 18px;
            }
            
            .action-buttons {
                margin-bottom: 15px;
                flex-direction: row;
                width: 100%;
                max-width: 400px;
                margin-left: auto;
                margin-right: auto;
            }
            
            .action-btn {
                padding: 10px 20px;
                font-size: 0.9rem;
                flex: 1;
                min-width: auto;
            }
            
            .filters {
                margin-bottom: 20px;
                max-width: 400px;
            }
            
            .song-card {
                padding: 8px 10px;
                min-height: 44px;
                height: 44px;
            }
            
            .song-number {
                font-size: 1.2rem;
                min-width: 25px;
                margin-right: 10px;
            }
            
            .song-title {
                font-size: 0.95rem;
            }
            
            .select-selected {
                height: 44px;
                padding: 10px 15px;
            }
            
            .empty-message {
                margin-top: 15px;
                padding: 25px;
            }
            
            .back-to-top {
                bottom: 20px;
                right: 20px;
                width: 45px;
                height: 45px;
            }
        }
        
        @media (max-width: 480px) {
            .search-box {
                padding: 10px 15px;
                max-width: 320px;
                margin: 5px auto 10px;
                height: 46px;
            }
            
            .action-buttons {
                flex-direction: row;
                gap: 10px;
                margin-bottom: 15px;
                max-width: 320px;
            }
            
            .action-btn {
                width: auto;
                padding: 12px;
                flex: 1;
            }
            
            .filters {
                gap: 10px;
                margin-bottom: 15px;
                max-width: 320px;
            }
            
            .custom-select {
                min-width: 120px;
            }
            
            .select-selected {
                padding: 8px 16px;
                font-size: 0.9rem;
                height: 42px;
            }
            
            .song-list {
                grid-template-columns: 1fr;
                margin-top: 15px;
                gap: 8px;
            }
            
            .profile-img {
                width: 80px;
                height: 80px;
            }
            
            header h1 {
                margin-bottom: 5px;
            }
            
            header p {
                margin-bottom: 3px;
            }
            
            .song-card {
                padding: 8px 10px;
                min-height: 42px;
                height: 42px;
            }
            
            .song-number {
                font-size: 1.1rem;
                min-width: 22px;
                margin-right: 8px;
            }
            
            .song-title {
                font-size: 0.9rem;
            }
            
            .empty-message {
                margin-top: 15px;
                padding: 20px;
                font-size: 1.1rem;
            }
            
            .back-to-top {
                bottom: 15px;
                right: 15px;
                width: 40px;
                height: 40px;
            }
            
            .back-to-top i {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="profile-container">
                <img src="b.jpg" alt="个人头像" class="profile-img">
                <h1>风筝</h1>
                <p id="song-count">风筝的23首拿手歌</p>
            </div>
        </header>
        
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="search-input" placeholder="搜索歌曲...">
        </div>
        
        <div class="action-buttons">
            <button class="action-btn" id="random-song">
                <i class="fas fa-random"></i> 随便听听
            </button>
            <button class="action-btn" id="find-me">
                <i class="fas fa-search-location"></i> 来找我吧
            </button>
        </div>
        
        <div class="filters">
            <div class="custom-select">
                <div class="select-selected">全部歌曲</div>
                <div class="select-items">
                    <div class="select-item" value="all">全部歌曲</div>
                    <div class="select-item" value="A">A</div>
                    <div class="select-item" value="B">B</div>
                    <div class="select-item" value="C">C</div>
                    <div class="select-item" value="D">D</div>
                    <div class="select-item" value="E">E</div>
                    <div class="select-item" value="F">F</div>
                    <div class="select-item" value="G">G</div>
                    <div class="select-item" value="H">H</div>
                    <div class="select-item" value="I">I</div>
                    <div class="select-item" value="J">J</div>
                    <div class="select-item" value="K">K</div>
                    <div class="select-item" value="L">L</div>
                    <div class="select-item" value="M">M</div>
                    <div class="select-item" value="N">N</div>
                    <div class="select-item" value="O">O</div>
                    <div class="select-item" value="P">P</div>
                    <div class="select-item" value="Q">Q</div>
                    <div class="select-item" value="R">R</div>
                    <div class="select-item" value="S">S</div>
                    <div class="select-item" value="T">T</div>
                    <div class="select-item" value="U">U</div>
                    <div class="select-item" value="V">V</div>
                    <div class="select-item" value="W">W</div>
                    <div class="select-item" value="X">X</div>
                    <div class="select-item" value="Y">Y</div>
                    <div class="select-item" value="Z">Z</div>
                    <div class="select-item" value="#">#（数字/符号）</div>
                </div>
            </div>
        </div>
        
        <div class="song-list" id="song-list">
            <!-- 歌曲将通过JavaScript动态生成 -->
        </div>
        
        <div class="copy-notification" id="copy-notification">已复制到剪贴板</div>
        
        <!-- 回到顶部按钮 -->
        <div class="back-to-top" id="back-to-top">
            <i class="fas fa-arrow-up"></i>
        </div>
    </div>

    <script>
        // 扩展的中文拼音首字母映射
        const pinyinMap = {
            '处': 'C', '天': 'T', '人': 'R', '牵': 'Q', '恋': 'L', '爱': 'A', 
            '起': 'Q', '晴': 'Q', '光': 'G', '稻': 'D', '泡': 'P', '说': 'S',
            '七': 'Q', '里': 'L', '香': 'X', '夜': 'Y', '曲': 'Q', '江': 'J',
            '南': 'N', '青': 'Q', '花': 'H', '海': 'H', '明': 'M', '月': 'Y',
            '星': 'X', '空': 'K', '大': 'D', '小': 'X', '雨': 'Y', '风': 'F',
            // 新增常见中文首字母映射
            '勇': 'Y', '后': 'H', '童': 'T', '加': 'J', '油': 'Y', '新': 'X',
            '歌': 'G', '幸': 'X', '运': 'Y', '海': 'H', '浪': 'L', '山': 'S',
            '水': 'S', '云': 'Y', '梦': 'M', '心': 'X', '情': 'Q', '思': 'S',
            '想': 'X', '念': 'N', '泪': 'L', '笑': 'X', '哭': 'K', '喜': 'X',
            '怒': 'N', '哀': 'A', '乐': 'L', '春': 'C', '夏': 'X', '秋': 'Q',
            '冬': 'D', '红': 'H', '黄': 'H', '蓝': 'L', '绿': 'L', '紫': 'Z',
            '白': 'B', '黑': 'H', '灰': 'H', '金': 'J', '银': 'Y', '铜': 'T',
            '铁': 'T', '石': 'S', '木': 'M', '火': 'H', '土': 'T', '电': 'D',
            '冰': 'B', '雪': 'X', '雨': 'Y', '雷': 'L', '风': 'F', '日': 'R',
            '月': 'Y', '星': 'X', '辰': 'C', '天': 'T', '地': 'D', '人': 'R',
            '生': 'S', '死': 'S', '爱': 'A', '恨': 'H', '情': 'Q', '仇': 'C',
            '你': 'N', '我': 'W', '他': 'T', '她': 'T', '它': 'T', '们': 'M'
        };

        // 获取中文拼音首字母
        function getPinyinInitial(char) {
            // 如果是英文字母或数字,直接返回大写形式
            if (/[A-Za-z0-9]/.test(char)) {
                return char.toUpperCase();
            }
            
            // 如果是中文字符,返回映射的首字母,如果没有映射则使用原字符
            return pinyinMap[char] || char;
        }

        // 获取歌曲的首字母（处理多字符情况）
        function getSongInitial(title) {
            if (!title || title.length === 0) return "#";
            
            const firstChar = title[0];
            
            // 如果是英文或数字开头
            if (/[A-Za-z0-9]/.test(firstChar)) {
                return firstChar.toUpperCase();
            }
            
            // 如果是中文,使用拼音映射
            return getPinyinInitial(firstChar);
        }

        // 指定歌曲数据

        // 更新歌曲计数
        function updateSongCount(count) {
            document.getElementById('song-count').textContent = `风筝的${count}首歌`;
        }

        // 复制文本到剪贴板
        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            
            // 显示复制通知
            const notification = document.getElementById('copy-notification');
            notification.textContent = `已复制: ${text}`;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 2000);
        }

        // 随机选择一首歌
        function getRandomSong() {
            const randomIndex = Math.floor(Math.random() * songs.length);
            return songs[randomIndex].title;
        }

        // 渲染歌曲列表
        function renderSongs(songsArray) {
            const songList = document.getElementById('song-list');
            songList.innerHTML = '';
            
            // 更新歌曲计数
            updateSongCount(songsArray.length);
            
            if (songsArray.length === 0) {
                songList.innerHTML = '<div class="empty-message">当前没有这首歌哦~</div>';
                return;
            }
            
            songsArray.forEach((song, index) => {
                const songCard = document.createElement('div');
                songCard.className = 'song-card';
                songCard.setAttribute('data-title', song.title);
                
                songCard.innerHTML = `
                    <div class="song-number">${index + 1}</div>
                    <div class="song-info">
                        <h3 class="song-title">${song.title}</h3>
                    </div>
                `;
                
                // 添加点击复制功能
                songCard.addEventListener('click', function() {
                    const songTitle = this.getAttribute('data-title');
                    copyToClipboard(songTitle);
                    
                    // 添加复制反馈效果
                    this.classList.add('copied');
                    setTimeout(() => {
                        this.classList.remove('copied');
                    }, 1500);
                });
                
                songList.appendChild(songCard);
            });
        }
        
        // 自定义下拉菜单功能
        function initCustomSelect() {
            const customSelect = document.querySelector('.custom-select');
            const selectSelected = document.querySelector('.select-selected');
            const selectItems = document.querySelector('.select-items');
            const selectItemsList = document.querySelectorAll('.select-item');
            
            // 点击选择器时切换显示/隐藏下拉菜单
            selectSelected.addEventListener('click', function(e) {
                e.stopPropagation();
                selectItems.classList.toggle('active');
                selectSelected.classList.toggle('select-arrow-active');
            });
            
            // 点击选项时更新选择器
            selectItemsList.forEach(item => {
                item.addEventListener('click', function() {
                    const value = this.getAttribute('value');
                    selectSelected.textContent = this.textContent;
                    selectItems.classList.remove('active');
                    selectSelected.classList.remove('select-arrow-active');
                    
                    // 移除之前选中的样式
                    document.querySelectorAll('.select-item.selected').forEach(el => {
                        el.classList.remove('selected');
                    });
                    
                    // 添加选中样式
                    this.classList.add('selected');
                    
                    // 根据选择的值筛选歌曲
                    if (value === 'all') {
                        renderSongs(songs);
                    } else if (value === '#') {
                        // 筛选数字或符号开头的歌曲
                        const filteredSongs = songs.filter(song => 
                            /^[0-9!@#$%^&*()_+=\-[\]{};':"\\|,.<>/?]/.test(song.title)
                        );
                        renderSongs(filteredSongs);
                    } else {
                        // 筛选特定字母开头的歌曲
                        const filteredSongs = songs.filter(song => 
                            song.initial === value
                        );
                        renderSongs(filteredSongs);
                    }
                });
            });
            
            // 点击页面其他地方时关闭下拉菜单
            document.addEventListener('click', function(e) {
                if (!customSelect.contains(e.target)) {
                    selectItems.classList.remove('active');
                    selectSelected.classList.remove('select-arrow-active');
                }
            });
        }

        // 回到顶部功能
        function initBackToTop() {
            const backToTopBtn = document.getElementById('back-to-top');
            
            // 监听滚动事件
            window.addEventListener('scroll', function() {
                if (window.pageYOffset > 300) {
                    backToTopBtn.classList.add('visible');
                } else {
                    backToTopBtn.classList.remove('visible');
                }
            });
            
            // 点击回到顶部
            backToTopBtn.addEventListener('click', function() {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        }
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', () => {
            renderSongs(songs);
            initCustomSelect();
            initBackToTop(); // 初始化回到顶部按钮
            
            // 搜索功能
            const searchInput = document.getElementById('search-input');
            searchInput.addEventListener('input', () => {
                const searchTerm = searchInput.value.toLowerCase();
                const filteredSongs = songs.filter(song => 
                    song.title.toLowerCase().includes(searchTerm)
                );
                renderSongs(filteredSongs);
            });
            
            // 随机歌曲按钮
            document.getElementById('random-song').addEventListener('click', function() {
                const randomSong = getRandomSong();
                copyToClipboard(randomSong);
            });
            
            // 来找我吧按钮 - 修改为直接跳转
            document.getElementById('find-me').addEventListener('click', function() {
                // 直接跳转到链接
                window.open("https://b23.tv/BZV96Wh", "_blank");
            });
        });
    </script>
